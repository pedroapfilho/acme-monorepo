packages:
  - apps/*
  - packages/*

overrides:
  # 1.5.2 dropped the "types" conditions from its exports map, so the type
  # declarations resolve to a broken sibling .d.mts and every OpenAPI route
  # helper degrades to the error type (575 type-aware lint errors in apps/api).
  "@hono/zod-openapi": "1.5.1"

nodeLinker: hoisted

peerDependencyRules:
  allowedVersions:
    "@typescript-eslint/project-service>typescript": "7"
    "@typescript-eslint/tsconfig-utils>typescript": "7"
    "@typescript-eslint/typescript-estree>typescript": "7"
    "@typescript-eslint/utils>typescript": "7"

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  fallow: true
  msw: true
  prisma: true
  sharp: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.1"
  - "@better-auth/drizzle-adapter@1.7.1"
  - "@better-auth/kysely-adapter@1.7.1"
  - "@better-auth/memory-adapter@1.7.1"
  - "@better-auth/mongo-adapter@1.7.1"
  - "@better-auth/prisma-adapter@1.7.1"
  - "@better-auth/telemetry@1.7.1"
  - better-auth@1.7.1
  - "@oxlint-tsgolint/darwin-arm64@7.0.2001"
  - "@oxlint-tsgolint/darwin-x64@7.0.2001"
  - "@oxlint-tsgolint/linux-arm64@7.0.2001"
  - "@oxlint-tsgolint/linux-x64@7.0.2001"
  - "@oxlint-tsgolint/win32-arm64@7.0.2001"
  - "@oxlint-tsgolint/win32-x64@7.0.2001"
  - oxlint-tsgolint@7.0.2001
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness
  - "@next/env@16.3.0"
  - "@next/swc-darwin-arm64@16.3.0"
  - "@next/swc-darwin-x64@16.3.0"
  - "@next/swc-linux-arm64-gnu@16.3.0"
  - "@next/swc-linux-arm64-musl@16.3.0"
  - "@next/swc-linux-x64-gnu@16.3.0"
  - "@next/swc-linux-x64-musl@16.3.0"
  - "@next/swc-win32-arm64-msvc@16.3.0"
  - "@next/swc-win32-x64-msvc@16.3.0"
  - next@16.3.0
  - oxlint-plugin-react-doctor@0.9.12
  - "@react-email/ui@6.9.2"
  - react-email@6.9.2
  - "@oxlint/binding-android-arm-eabi@1.79.0"
  - "@oxlint/binding-android-arm64@1.79.0"
  - "@oxlint/binding-darwin-arm64@1.79.0"
  - "@oxlint/binding-darwin-x64@1.79.0"
  - "@oxlint/binding-freebsd-x64@1.79.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.79.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.79.0"
  - "@oxlint/binding-linux-arm64-gnu@1.79.0"
  - "@oxlint/binding-linux-arm64-musl@1.79.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.79.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.79.0"
  - "@oxlint/binding-linux-riscv64-musl@1.79.0"
  - "@oxlint/binding-linux-s390x-gnu@1.79.0"
  - "@oxlint/binding-linux-x64-gnu@1.79.0"
  - "@oxlint/binding-linux-x64-musl@1.79.0"
  - "@oxlint/binding-openharmony-arm64@1.79.0"
  - "@oxlint/binding-win32-arm64-msvc@1.79.0"
  - "@oxlint/binding-win32-ia32-msvc@1.79.0"
  - "@oxlint/binding-win32-x64-msvc@1.79.0"
  - "@oxlint/plugins@1.79.0"
