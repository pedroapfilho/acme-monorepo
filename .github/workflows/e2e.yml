name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 10 4 * * 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan validation
        id: plan
        run: node .github/ci/ci.mjs plan e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-selection-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  e2e:
    needs:
      - ci-plan
    if: ${{ always() && (needs.ci-plan.result != 'success' || needs.ci-plan.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      PGAPPNAME: acme:ci:e2e
      BETTER_AUTH_SECRET: test-secret-minimum-32-characters-long-for-e2e
      EXPOSE_TESTING_API: 1
      # Use 127.0.0.1 (not localhost) to match playwright.config.ts baseURL.
      # Mismatched hosts split cookie scope: sign-in sets cookies on
      # 127.0.0.1 but cross-origin fetches to localhost don't send them,
      # producing 401s on every authed API request from browser tests.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_APP_URL: http://127.0.0.1:3000
      # Gates the tests/e2e/auth-email/* suite. When unset (forks,
      # contributors without secret access), those specs `test.skip()`
      # themselves and the rest of the suite still runs. When set, the
      # auth server flips on requireEmailVerification; the seed script
      # bypasses that for the canonical e2e-test user by writing
      # emailVerified: true directly to Prisma.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_TEST }}
      FROM_EMAIL: "Acme <noreply@email.acme.com>"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Require a successful CI plan
        env:
          RESULT: ${{ needs.ci-plan.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record validation inputs
        run: node .github/ci/ci.mjs plan e2e
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node24-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node24-e2e-push-main-
      - name: Restore Next.js compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "apps/*/.next/cache"
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-push-main-
      - run: pnpm db:push
      - run: pnpm build --filter=web --filter=api --filter=landing
      - name: Seed E2E test user
        run: pnpm --filter web exec tsx scripts/ensure-e2e-user.ts
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Playwright browsers and system deps
        run: pnpm exec playwright install --with-deps chromium
      - run: node .github/ci/ci.mjs run e2e -- pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload CI evidence
        if: ${{ !cancelled() }}
        with:
          name: ci-execution-${{ github.workflow }}-${{ github.job }}-${{ github.run_attempt }}
          path: .ci-results/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
