name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: test-secret-minimum-32-characters-long-for-e2e
      EXPOSE_TESTING_API: 1
      # Use 127.0.0.1 (not localhost) to match playwright.config.ts baseURL.
      # Mismatched hosts split cookie scope: sign-in sets cookies on
      # 127.0.0.1 but cross-origin fetches to localhost don't send them,
      # producing 401s on every authed API request from browser tests.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_APP_URL: http://127.0.0.1:3000
      # Gates the tests/e2e/auth-email/* suite. When unset (forks,
      # contributors without secret access), those specs `test.skip()`
      # themselves and the rest of the suite still runs. When set, the
      # auth server flips on requireEmailVerification; the seed script
      # bypasses that for the canonical e2e-test user by writing
      # emailVerified: true directly to Prisma.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_TEST }}
      FROM_EMAIL: "Acme <noreply@email.acme.com>"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Turbo task cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            turbo-${{ runner.os }}-e2e-push-main-
      # Turbo restores complete build outputs on a task hit. Preserve Next's
      # compiler cache separately so changed apps can still compile incrementally.
      - name: Restore Next.js compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/web/.next/cache
            apps/landing/.next/cache
          key: next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            next-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-e2e-push-main-
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm build --filter=web --filter=api --filter=landing
      - name: Seed E2E test user
        run: pnpm --filter web exec tsx scripts/ensure-e2e-user.ts
      # Canonical Playwright CI pattern (playwright.dev/docs/ci): browser
      # download + apt system deps in one step. Caching is explicitly
      # *not* recommended by the docs; restore time is comparable to a
      # fresh download. The chromium pin matches playwright.config.ts
      # which filters firefox/webkit out under CI.
      - name: Install Playwright browsers and system deps
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
