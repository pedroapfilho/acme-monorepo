name: Secret Scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for GitHub
  # organizations, so the free binary is installed directly instead: same
  # scanner, no license.
  GITLEAKS_VERSION: 8.30.1
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1
